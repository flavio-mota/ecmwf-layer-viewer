<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECMWF Viewer</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="map"></div>

    <div class="controls">
        <h3 class="controls-title">ECMWF Viewer</h3>

        <div class="control-group">
            <label for="paramSelect">Parâmetro:</label>
            <select id="paramSelect"></select>
        </div>

        <div class="control-group">
            <label for="dateSelect">Data:</label>
            <select id="dateSelect"></select>
        </div>

        <div class="control-group">
            <label for="runTimeSelect">Horário (run time):</label>
            <select id="runTimeSelect"></select>
        </div>

        <div class="control-group">
            <label for="stepSelect">Step (horas):</label>
            <select id="stepSelect"></select>
        </div>

        <div class="control-group" id="levelGroup">
            <label for="levelSelect">Nível de Pressão (hPa):</label>
            <select id="levelSelect"></select>
        </div>

        <div class="control-group">
            <label for="opacitySlider">Opacidade: <span id="opacityValue">70%</span></label>
            <input type="range" id="opacitySlider" min="0" max="100" value="70">
        </div>

        <div class="control-group">
            <label for="animationTypeSelect">Animação:</label>
            <select id="animationTypeSelect">
                <option value="steps">Temporal (Steps)</option>
                <option value="levels">Profundidade (Níveis)</option>
            </select>
        </div>

        <div class="animation-controls">
            <button id="playBtn">▶ Play</button>
            <button id="stopBtn" disabled>⏸ Pause</button>
        </div>

        <div class="info-display">
            <div id="currentInfo">Inicializando...</div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-title" id="legendTitle">Legenda</div>
        <div class="legend-image-container">
            <img id="wmsLegend" alt="Carregando legenda..." />
        </div>
        <div class="legend-footer">GeoServer WMS</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
